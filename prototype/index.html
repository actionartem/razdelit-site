<script>
(()=>{
'use strict';
const landingEmbed = new URLSearchParams(location.search).get('embed') === 'landing';
if(landingEmbed){document.documentElement.classList.add('landing-embed');document.title='Разделить | Счёт стола';}
const $=id=>document.getElementById(id);
let guestLanguage='ru',noticeMessage='';
try{const saved=localStorage.getItem('splitbill-language');if(['ru','en','zh'].includes(saved))guestLanguage=saved}catch{}
if(landingEmbed) guestLanguage='ru';
const i18n=window.SplitBillI18n;

window.addEventListener('resize',fitDevice);

 if(role==='guest'){$('view').innerHTML=`<div class="device-presentation"><div class="device-caption">iPhone 17</div><div class="device-stage"><div class="phone" aria-label="Интерактивный макет телефона"><span class="device-side mute" aria-hidden="true"></span><span class="device-side volume-up" aria-hidden="true"></span><span class="device-side volume-down" aria-hidden="true"></span><span class="device-side power" aria-hidden="true"></span><div class="phone-screen"><div class="ios-status" aria-hidden="true"><span>9:41</span><span class="dynamic-island"></span><span class="ios-indicators"><span class="signal"><i></i><i></i><i></i><i></i></span><span style="font-size:11px">5G</span><span class="battery"></span></span></div><div class="phonehead"><div class="row between"><span class="brand">КАФЕ / 07</span><span class="badge">Стол ${staffTable}</span></div><div class="small">Гость ${guest}</div></div><div class="mobilebody">${offline?'<div class="error" role="alert">Нет связи. Показаны сохраненные данные.</div>':''}${closed?ended():guestBody()}</div><nav class="bottomnav" aria-label="Навигация гостя">${landingEmbed?`${btn('Общий счёт','screen','bill',screen==='bill'?'active':'')}${btn('Поровну','screen',shares.length?'shares':'split',['split','shares'].includes(screen)?'active':'')}`:`${btn('Меню','screen','menu',screen==='menu'?'active':'')}${btn('Корзина '+(cart.length?'('+cart.reduce((s,c)=>s+c.q,0)+')':''),'screen','cart',screen==='cart'?'active':'')}${btn('Счет / оплатить','screen','bill',screen==='bill'?'active':'')}${btn('Позвать официанта','call','',call?'called':'',offline||closed)}`}</nav><div class="home-indicator" aria-hidden="true"></div></div></div></div></div>`}
 else $('view').innerHTML=`<div class="shell"><div class="staffhead row between"><div><div class="small">КАФЕ / 07 · бэк-офис</div><strong>Анна · менеджер</strong></div></div><nav class="staffnav" aria-label="Навигация сотрудников">${staffScreens.slice(0,7).filter(([id])=>!['table','add'].includes(id)).map(([id,name])=>btn(name.split(' · ')[1],'screen',id,staffScreen===id?'active':'')).join('')}</nav><div class="staffbody">${staffBody()}</div></div>`;
 if(role==='guest'){document.querySelector('.phone-screen').append($('toast'));$('toast').textContent=noticeMessage;i18n.apply(document.querySelector('.phone-screen'),guestLanguage);if(guestViewKey===renderedGuestView)document.querySelector('.mobilebody').scrollTop=previousScroll;}renderedGuestView=guestViewKey;

function guestBody(){if(screen==='menu')return menu();if(screen==='cart')return basket();if(screen==='bill')return bill();if(screen==='split')return split();if(screen==='shares')return shareScreen();if(screen==='checkout')return checkout();if(screen==='status')return payStatus();return menu()}
const dishImages={1:'burger.png',2:'pizza.png',3:'lemonade.png',4:'cappuccino.png',5:'cheesecake.png',6:'salmon.png'};
function foodImage(p,large=false){const file=dishImages[p.id];return file?`<img src="assets/food/${file}" alt="${esc(p.name)}" width="1448" height="1086" loading="${large?'eager':'lazy'}" decoding="async">`:''}
function menu(){const categories=['Самое популярное',...new Set(['Рыба','Мясо','Горячее','Напитки','Десерты',...catalog.map(p=>p.cat)].filter(c=>catalog.some(p=>p.cat===c))),'Все блюда'];if(!categories.includes(category))category='Самое популярное';const list=catalog.filter(p=>(category==='Все блюда'||(category==='Самое популярное'?p.popular:p.cat===category))&&i18n.text(p.name,guestLanguage).toLowerCase().includes(search.toLowerCase()));return `${top('Меню','G01')}<input id="search" type="search" placeholder="Найти блюдо в разделе" aria-label="Поиск блюда" value="${esc(search)}" style="width:100%"><div class="menu-layout"><nav class="menu-categories" aria-label="Категории меню">${categories.map(c=>`<button data-action="category" data-value="${esc(c)}" class="${category===c?'active':''}" aria-current="${category===c?'true':'false'}">${esc(c)}</button>`).join('')}</nav><section class="menu-products" aria-label="Блюда категории"><h2>${esc(category)}</h2>${list.map(p=>`<article class="dish ${p.stock?'':'disabled'}"><button class="photo" data-action="dish" data-value="${p.id}" ${p.stock?'':'disabled'} aria-label="Открыть ${esc(p.name)}">${foodImage(p)}${p.stock?'':'<span class="badge warn">Нет в наличии</span>'}</button><div><h3>${esc(p.name)}</h3><div class="small">${esc(p.weight)}</div><p>${esc(p.desc)}</p><div class="row between"><span class="money">${money(p.price)}</span>${p.stock?btn('Добавить','add',p.id,'add',offline):''}</div></div></article>`).join('')||'<div class="empty">В этом разделе ничего не найдено</div>'}</section></div>`}
function basket(){return `${top('Моя корзина','G03')}${cart.length?cart.map((c,i)=>`<div class="item"><h3>${esc(c.name)}</h3><div class="small">${c.variant||'Стандартная порция'}</div><div class="row between"><div class="count">${btn('−','cartminus',i)}<span>${c.q}</span>${btn('+','cartplus',i)}</div><span class="money">${money(c.price*c.q)}</span></div></div>`).join('')+`<div class="totals row between"><span>Сумма заказа</span><strong>${money(cart.reduce((s,c)=>s+c.price*c.q,0))}</strong></div>${btn('Отправить заказ','submit','','primary widebtn',offline)}`:'<div class="empty">Корзина пока пустая.</div>'+btn('Открыть меню','screen','menu','primary widebtn')}`}
function bill(){if(landingEmbed)return landingBill();const ss=selSum();return `${top('Общий счет','G04')}<div class="summary"><div><div class="small">Осталось оплатить</div><strong>${money(unpaid())}</strong></div><div><div class="small">Оплачено</div><strong>${money(paid())}</strong></div></div><div class="row">${btn('Мои позиции','mine')}${btn('Выбрать все','all','')}${btn('Снять выбор','none')}</div>${orders.map(o=>{const available=positionFree().filter(a=>a.line===o.id);const chosen=available.filter(a=>selected.includes(a.id));const chosenUnits=new Set(chosen.map(a=>a.unit)).size;return `<div class="item"><div class="row between"><h3>${o.q} × ${esc(o.name)}</h3><span class="money">${money(o.price*o.q)}</span></div><div class="small">Гость ${o.guest}${o.variant?' · '+o.variant:''}</div><div class="row" style="margin:8px 0">${rowState(o)}</div>${available.length?`<div class="row between"><span class="small">Выбрано ${chosenUnits} из ${new Set(available.map(a=>a.unit)).size}</span><div class="count">${btn('−','selectminus',o.id,'',!chosen.length)}${btn('+','selectplus',o.id,'',!available.some(a=>!selected.includes(a.id)))}${btn(chosen.length===available.length?'Убрать':'Выбрать','selectline',o.id)}</div></div>`:''}${allocations.some(a=>a.line===o.id&&a.share)?'<div class="small">В равном разделении · оплата через «Поровну»</div>':''}</div>`}).join('')}<div class="totals"><div class="row between"><span>Выбрано к оплате</span><strong>${money(ss)}</strong></div>${btn('Оплатить выбранное','payselected','','primary',!ss||offline)}${shares.length?btn('Поровну: '+shares.length+' человек','screen','shares'):btn('Поделить на всех','screen','split','',offline||!positionFree().length)}</div>${!orders.length?'<div class="empty">В счете пока нет позиций.</div>':!unpaid()?'<div class="note">Счет оплачен.</div>':''}`}
function split(){if(shares.length)return shareScreen();const ss=selSum();return `${top('Поделить на всех','G05')}${btn('Весь счет','all','','widebtn',offline)}${orders.map(o=>{let aa=positionFree().filter(a=>a.line===o.id);return aa.length?`<label class="check"><input type="checkbox" data-line="${o.id}" ${aa.every(a=>selected.includes(a.id))?'checked':''} ${offline?'disabled':''}><span>${esc(o.name)}<br><span class="small">${money(aa.reduce((s,a)=>s+a.amount,0))} · Гость ${o.guest}</span></span></label>`:''}).join('')}<label class="field"><span>На сколько людей делим</span><input id="splitCount" type="number" min="2" max="30" value="${splitCount}"></label><div class="totals"><div class="row between"><span>В «Поделить на всех»</span><strong>${money(ss)}</strong></div><div class="row between"><span>На человека, примерно</span><strong id="perShare">${money(Math.floor(ss/splitCount))}</strong></div></div>${btn('Создать равные доли','createshares','','primary widebtn',!ss||offline)}${btn('Назад к счету','screen','bill','widebtn')}`}

function editSplit(){if(allocations.some(a=>a.share&&a.state!=='free')){notice('Нельзя изменить разделение после начала оплаты');return}const aa=allocations.filter(a=>a.share),merged=new Map();aa.forEach(a=>{const key=a.line+':'+a.unit;const item=merged.get(key);if(item)item.amount+=a.amount;else merged.set(key,{...a,id:++uid,share:null,pay:null})});allocations=allocations.filter(a=>!a.share).concat([...merged.values()]);shares=[];selected=[...merged.values()].map(a=>a.id);screen='split';render()}

function tables(){const tableButtons=[1,2,3,4,5,6,7,8,9].map((t,i)=>{const current=t===staffTable&&!closed;return `<button class="table ${current?'current':''}" data-action="opentable" data-value="${t}" ${current?'':'disabled'} ${map?`style="left:${8+(i%3)*31}%;top:${20+Math.floor(i/3)*95}px"`:''}><strong>${t}</strong><span class="small">${current?'Текущий визит':'Свободен'}</span>${current?`<span class="money">${money(unpaid())}</span>${call?'<span class="badge warn">Вызов</span>':''}`:''}</button>`}).join('');return `${top('Столы','B02')}<div class="row between"><span class="muted">Все столы · текущая смена</span><div class="switch">${btn('Карточки','tableview','cards',!map?'active':'')}${btn('Схема зала','tableview','map',map?'active':'')}</div></div><div class="${map?'floor':'tables'}">${tableButtons}${map?'':''}</div>${closed?'<div class="note">Текущий визит закрыт. Новый начнется при следующем сканировании QR.</div>':''}`}
function staffOrder(){return `${top('Стол '+staffTable,'B03')}<div class="row between"><span class="muted">Текущий визит · гости 1–3</span><div class="row">${btn('Добавить заказ','screen','add','',closed)}${btn('Перенести','transfer','', '',closed)}${btn('Закрыть стол','close','', '',closed)}</div></div><div class="staffcols" style="margin-top:22px"><div>${orders.map(o=>`<div class="item"><div class="row between"><h3>${o.q} × ${esc(o.name)}</h3><strong>${money(o.q*o.price)}</strong></div><div class="small">Гость ${o.guest}${o.variant?' · '+o.variant:''}</div><div class="row" style="margin:8px 0">${rowState(o)}</div><div class="lineactions row">${!o.cancelled&&!o.served?btn('Подали → Выполнен','serve',o.id):''}${!o.cancelled?btn('Отменить позицию','cancelorder',o.id,'danger'):''}</div></div>`).join('')||'<div class="empty">Новых заказов пока нет.</div>'}</div><aside class="aside"><h3>Расчет стола</h3><div class="totals"><div class="row between"><span>Заказ</span><strong>${money(total())}</strong></div><div class="row between"><span>Оплачено</span><strong>${money(paid())}</strong></div><div class="row between"><span>Остаток</span><strong>${money(unpaid())}</strong></div></div><h3>Запросы оплаты</h3>${paymentTasks()}<h3 style="margin-top:20px">Действия</h3>${log.slice(0,5).map(l=>`<p class="small">${esc(l.text)}<br>${esc(l.by)}</p>`).join('')||'<p class="small">Новых действий нет.</p>'}</aside></div>`}
function paymentTasks(){return payments.filter(p=>p.state==='locked').map(p=>`<div class="task"><h3>${money(p.amount)} · ${p.method==='cash'?'Наличные':p.method==='terminal'?'Терминал':'Онлайн'}</h3><div class="small">${esc(p.label)}</div>${['cash','terminal'].includes(p.method)?`<div class="row" style="margin-top:10px">${!p.taking?btn('Начать прием','takepay',p.id):btn('Подтвердить получение','paysuccess',p.id,'primary')}</div>`:'<p class="small">Проверяем результат партнера. Повторно не списывать.</p>'}</div>`).join('')||'<p class="small">Нет активных запросов.</p>'}
function tasks(){return `${top('Задачи','B04')}${call?`<div class="task"><div class="row between"><h3>Вызов · стол ${staffTable}</h3><span class="badge warn">${call.taken?'Анна взяла в работу':'Новый'}</span></div><div class="row">${settings.take&&!call.taken?btn('Взять в работу','takecall'):''}${btn('Выполнено','donecall')}</div></div>`:''}${orders.filter(o=>!o.served&&!o.cancelled).map(o=>`<div class="task"><div class="row between"><h3>${o.q} × ${esc(o.name)}</h3><span class="small">Стол ${staffTable} · Гость ${o.guest}</span></div><div class="row">${settings.route==='approval'&&!o.approved?btn('Подтвердить внутренне','approve',o.id):'<span class="badge">Передано исполнителю</span>'}${btn('Подали → Выполнен','serve',o.id)}</div></div>`).join('')}${paymentTasks()}`}
function staffAdd(){return `${top('Добавить устный заказ','B05')}<label class="field"><span>Гость — обязательно</span><select id="staffGuest"><option value="1">Гость 1</option><option value="2">Гость 2</option><option value="3">Гость 3</option><option value="4">Создать Гостя 4 без телефона</option></select></label>${catalog.map(p=>`<div class="item row between"><div><strong>${esc(p.name)}</strong><div class="small">${money(p.price)}</div></div>${btn('Добавить в заказ','staffadd',p.id,'',!p.stock||closed||!settings.verbal)}</div>`).join('')}<p class="small">${settings.verbal?'':'Устные заказы отключены.'}</p>${btn('Вернуться к столу','screen','table')}`}
function staffMenu(){return `${top('Меню заведения','B07')}<div class="row">${btn('Создать блюдо','editdish','new','primary')}${btn('Загрузить таблицу','import')}</div><div class="tablewrap"><table><thead><tr><th>Блюдо</th><th>Категория</th><th>Цена</th><th>Доступность</th><th></th></tr></thead><tbody>${catalog.map(p=>`<tr><td>${esc(p.name)}<div class="small">${p.weight}</div></td><td>${esc(p.cat)}</td><td>${money(p.price)}</td><td>${btn(p.stock?'В наличии':'Нет в наличии','stock',p.id)}</td><td>${btn('Редактировать','editdish',p.id)}</td></tr>`).join('')}</tbody></table></div>`}
function reports(){return `${top('Отчеты','B08')}<div class="row"><label>Период <input type="date" value="2026-10-03" disabled></label></div><div class="summary" style="margin-top:20px"><div><span class="small">Поступления по исходным оплатам</span><h2>${money(paid())}</h2></div><div><span class="small">Неоплаченный остаток</span><h2>${money(unpaid())}</h2></div></div><h3>По способам оплаты</h3><table><thead><tr><th>Способ</th><th>Подтверждено</th></tr></thead><tbody>${[['СБП','sbp'],['Карта онлайн','card'],['Терминал','terminal'],['Наличные','cash']].map(([name,method])=>`<tr><td>${name}</td><td>${money(payments.filter(p=>p.state==='paid'&&p.method===method).reduce((s,p)=>s+p.amount,0))}</td></tr>`).join('')}</tbody></table><h3 style="margin-top:24px">Продажи по блюдам · заказанные позиции</h3><table><thead><tr><th>Блюдо</th><th>Количество</th><th>Стоимость</th></tr></thead><tbody>${orders.filter(o=>!o.cancelled).map(o=>`<tr><td>${esc(o.name)}</td><td>${o.q}</td><td>${money(o.q*o.price)}</td></tr>`).join('')}</tbody></table><h3 style="margin-top:24px">История визита</h3><p>Стол ${staffTable} · ${closed?'Закрыт':'Открыт'} · остаток ${money(unpaid())}</p><p class="small">Внешние возвраты не учтены. Эти суммы не являются чистой выручкой после возвратов.</p>`}
function settingScreen(){return `${top('Правила заведения','B09')}<div class="formgrid"><label class="field"><span>Маршрут заказа</span><select data-setting="route"><option value="approval" ${settings.route==='approval'?'selected':''}>Сначала официанту</option><option value="direct" ${settings.route==='direct'?'selected':''}>Напрямую исполнителю</option></select></label><label class="field"><span>Назначение столов</span><select data-setting="assignment"><option value="shared" ${settings.assignment==='shared'?'selected':''}>Общая очередь</option><option value="assigned" ${settings.assignment==='assigned'?'selected':''}>Закрепление за сотрудником</option></select></label></div>${[['take','Кнопка «Взять в работу»'],['debt','Разрешить закрытие с долгом'],['verbal','Устный заказ через сотрудника']].map(([k,name])=>`<label class="check"><input type="checkbox" data-setting="${k}" ${settings[k]?'checked':''}><span>${name}</span></label>`).join('')}`}
function login(){return `${top('Вход сотрудника','B01')}<div style="max-width:360px"><label class="field"><span>Личная учетная запись</span><input placeholder="Логин сотрудника" autocomplete="username"></label><label class="field"><span>Пароль</span><input type="password" placeholder="Пароль" autocomplete="current-password"></label>${btn('Войти','screen','tables','primary widebtn')}<hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Общее устройство</h3><label class="field"><span>Переключение по личному PIN</span><input type="password" inputmode="numeric" placeholder="••••"></label>${btn('Переключить сотрудника','screen','tables','widebtn')}</div>`}
let modalTrigger=null;
function modal(html){const dialog=$('dialog');if(dialog.open)closeDialog();modalTrigger=document.activeElement;$('dialogContent').innerHTML=html;const title=dialog.querySelector('h2');if(title){title.id='modalTitle';dialog.setAttribute('aria-labelledby','modalTitle')}else dialog.removeAttribute('aria-labelledby');if(role==='guest'){i18n.apply(dialog,guestLanguage);const phone=document.querySelector('.phone-screen'),overlay=document.createElement('div');overlay.className='phone-modal-overlay';phone.append(overlay);overlay.append(dialog);[...phone.children].filter(el=>el!==overlay).forEach(el=>el.inert=true);dialog.setAttribute('aria-modal','true');dialog.show();dialog.querySelector('input,select,textarea,button')?.focus()}else dialog.showModal()}
function closeDialog(){const dialog=$('dialog'),overlay=dialog.closest('.phone-modal-overlay');dialog.close();dialog.removeAttribute('aria-modal');if(overlay){const phone=overlay.parentElement;document.body.append(dialog);overlay.remove();[...phone.children].forEach(el=>el.inert=false)}if(modalTrigger?.isConnected)modalTrigger.focus();modalTrigger=null}
$('dialog').addEventListener('keydown',e=>{if(!$('dialog').closest('.phone-modal-overlay'))return;if(e.key==='Escape'){e.preventDefault();closeDialog()}else if(e.key==='Tab'){const controls=[...$('dialog').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')];const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
function addToCart(p,variant='',price=p.price){if(activeCartGuest!==guest){carts[activeCartGuest]=cart;cart=carts[guest]||[];activeCartGuest=guest}const existing=cart.find(c=>c.product===p.id&&c.variant===variant);if(existing)existing.q++;else cart.push({product:p.id,name:p.name,variant,price,q:1});notice('Добавлено в корзину');render()}
function dish(p){modal(`<div class="photo large">${foodImage(p,true)}</div><h2>${esc(p.name)}</h2><p>${esc(p.desc)}</p><p class="small">${p.weight}</p>${p.variants.length?`<label class="field"><span>Выберите вариант</span><select id="variant">${p.variants.map(([v,price],i)=>`<option value="${i}">${v} · ${money(price)}</option>`).join('')}</select></label>`:`<p class="money">${money(p.price)}</p>`}<div class="row">${btn('Добавить в корзину','modaladd',p.id,'primary',!p.stock||offline)}${btn('Закрыть','dismiss')}</div>`)}
function submit(){if(offline||!cart.length||closed)return;const bad=cart.find(c=>!catalog.find(p=>p.id===c.product)?.stock);if(bad){notice(bad.name+' больше нет в наличии. Уберите позицию из корзины.');return}cart.forEach(c=>{const o={id:++uid,product:c.product,name:c.name,variant:c.variant,price:c.price,q:c.q,guest,served:false,cancelled:false,approved:settings.route==='direct'};orders.push(o);for(let i=0;i<c.q;i++)allocations.push({id:++uid,line:o.id,unit:i,amount:c.price,state:'free',share:null,pay:null})});cart=[];carts[guest]=cart;audit('Отправлен заказ');screen='bill';notice('Заказ принят');render()}
function selectLine(id){const aa=positionFree().filter(a=>a.line===id);if(aa.every(a=>selected.includes(a.id)))selected=selected.filter(i=>!aa.some(a=>a.id===i));else selected=[...new Set([...selected,...aa.map(a=>a.id)])]}
function createShares(){if(shares.length){screen='shares';render();return}const aa=selection();if(!aa.length)return;const newShares=Array.from({length:splitCount},(_,i)=>({id:++uid,name:'Человек '+(i+1)}));let remainderCursor=0;const replacements=[];aa.forEach(a=>{const base=Math.floor(a.amount/splitCount),rem=a.amount%splitCount;const amounts=Array(splitCount).fill(base);for(let j=0;j<rem;j++)amounts[(remainderCursor+j)%splitCount]++;remainderCursor=(remainderCursor+rem)%splitCount;amounts.forEach((amount,i)=>{if(amount)replacements.push({...a,id:++uid,amount,share:newShares[i].id})})});allocations=allocations.filter(a=>!selected.includes(a.id)).concat(replacements);shares=newShares;selected=[];screen='shares';audit('Созданы равные доли: '+splitCount);render()}
function prepare(ids,label){if(offline)return;payment={ids:ids.filter(id=>free().some(a=>a.id===id)),label};if(!payment.ids.length){notice('Выбранная часть уже недоступна');return}screen='checkout';render()}
function startPay(method){if(offline||!payment)return;const aa=free().filter(a=>payment.ids.includes(a.id));if(aa.length!==payment.ids.length){notice('Счет изменился. Выберите позиции заново.');screen='bill';render();return}const amount=aa.reduce((s,a)=>s+a.amount,0);const p={id:++uid,ids:aa.map(a=>a.id),amount,method,label:payment.label,state:'locked',taking:false,tips:$('tips')?.checked?Math.round(amount*.1):0};payments.push(p);aa.forEach(a=>{a.state='locked';a.pay=p.id});statusId=p.id;selected=[];screen='status';audit('Начата оплата '+money(amount));render()}
function finishPayment(id,success){const p=payments.find(p=>p.id===id);if(!p||p.state!=='locked')return;allocations.filter(a=>a.pay===id).forEach(a=>{a.state=success?'paid':'free';if(!success)a.pay=null});p.state=success?'paid':'cancelled';audit(success?'Подтверждена оплата '+money(p.amount):'Оплата отменена');if(!success&&role==='guest')screen='bill';render()}
function editDish(id){const p=catalog.find(p=>p.id===id)||{name:'',cat:'Горячее',desc:'',weight:'',price:0};modal(`<h2>${id==='new'?'Новое блюдо':'Редактировать блюдо'}</h2><label class="field"><span>Название</span><input id="editName" value="${esc(p.name)}"></label><label class="field"><span>Категория</span><input id="editCat" value="${esc(p.cat)}"></label><label class="field"><span>Состав и описание</span><textarea id="editDesc">${esc(p.desc)}</textarea></label><label class="field"><span>Вес / объем</span><input id="editWeight" value="${esc(p.weight)}"></label><label class="field"><span>Цена, ₽</span><input id="editPrice" type="number" min="0" value="${p.price/100}"></label><label class="check"><input id="editPopular" type="checkbox" ${p.popular?'checked':''}>Показывать в «Самое популярное»</label><div class="row">${btn('Сохранить','savedish',id,'primary')}${id!=='new'?btn('Удалить из меню','deletedish',id,'danger'):''}${btn('Отмена','dismiss')}</div>`)}
document.addEventListener('click',e=>{const switcher=document.querySelector('.language-switch');if(switcher&&!switcher.contains(e.target))switcher.open=false;const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,v=b.dataset.value,id=Number(v);
 if(landingEmbed&&action==='resumedemo'){const pending=payments.find(p=>p.id===id&&p.state==='locked');if(pending){statusId=id;screen='status';render()}return}
 if(landingEmbed && (action==='role'||action==='screen'&&!['bill','split','shares','checkout','status'].includes(v)))return;
 if(action==='role'){role=v;render()}else if(action==='screen'){if(role==='guest')screen=v;else staffScreen=v;render()}
 else if(action==='reset'){role='guest';if(landingEmbed)setLandingScenario('items');else init()}
 else if(action==='language'){if(!['ru','en','zh'].includes(v))return;guestLanguage=v;search='';try{localStorage.setItem('splitbill-language',v)}catch{}render();document.querySelector('.language-switch summary')?.focus()}
 else if(action==='category'){category=v;render()}else if(action==='dish')dish(catalog.find(p=>p.id===id));
 else if(action==='add'){const p=catalog.find(p=>p.id===id);p.variants.length?dish(p):addToCart(p)}
 else if(action==='modaladd'){const p=catalog.find(p=>p.id===id),vv=$('variant')?p.variants[Number($('variant').value)]:null;closeDialog();addToCart(p,vv?vv[0]:'',vv?vv[1]:p.price)}
 else if(action==='dismiss')closeDialog();else if(action==='cartplus'){cart[id].q++;render()}else if(action==='cartminus'){if(--cart[id].q===0)cart.splice(id,1);render()}else if(action==='submit')submit();
 else if(action==='call'){if(!call){call={taken:false};audit('Вызван сотрудник');render();notice('Официант вызван')}else modal(`<h2>Официант вызван</h2><p>${call.taken?'Официант принял вызов и скоро подойдет.':'Запрос уже отправлен. Официант скоро подойдет.'}</p><div class="row">${btn('ОК','dismiss','','primary')}${btn('Отменить вызов','cancelcall')}</div>`)}
 else if(action==='cancelcall'){call=null;closeDialog();audit('Вызов отменен');render()}else if(action==='takecall'){call.taken=true;render()}else if(action==='donecall'){call=null;render()}
 else if(action==='all'){selected=positionFree().map(a=>a.id);render()}else if(action==='none'){selected=[];render()}else if(action==='mine'){selected=positionFree().filter(a=>orders.find(o=>o.id===a.line).guest===guest).map(a=>a.id);render()}else if(action==='selectline'){selectLine(id);render()}
 else if(action==='selectplus'){const aa=positionFree().filter(a=>a.line===id&&!selected.includes(a.id));if(aa.length)selected.push(...aa.filter(a=>a.unit===aa[0].unit).map(a=>a.id));render()}else if(action==='selectminus'){const aa=positionFree().filter(a=>a.line===id&&selected.includes(a.id));if(aa.length)selected=selected.filter(i=>!aa.filter(a=>a.unit===aa[aa.length-1].unit).some(a=>a.id===i));render()}
 else if(action==='editsplit')editSplit();else if(action==='createshares')createShares();else if(action==='payselected')prepare(selection().map(a=>a.id),'Выбранные позиции');else if(action==='payshare'){const s=shares.find(s=>s.id===id);prepare(free().filter(a=>a.share===id).map(a=>a.id),s.name)}else if(action==='startpay')startPay(v);else if(action==='paysuccess')finishPayment(id,true);else if(action==='payfail')finishPayment(id,false);
 else if(action==='cancelpay'){const p=payments.find(p=>p.id===id);if(p&&!p.taking)finishPayment(id,false)}else if(action==='takepay'){payments.find(p=>p.id===id).taking=true;render()}
 else if(action==='serve'){orders.find(o=>o.id===id).served=true;audit('Подана позиция');render()}else if(action==='approve'){orders.find(o=>o.id===id).approved=true;render()}
 else if(action==='cancelorder'){const o=orders.find(o=>o.id===id);if(allocations.some(a=>a.line===id&&a.state!=='free')){notice('Нельзя отменить позицию, которая оплачена или находится в оплате.');return}modal(`<h2>Отменить ${esc(o.name)}?</h2><label class="field"><span>Причина</span><select id="cancelReason"><option>Нет в наличии</option><option>По просьбе гостя</option><option>Ошибка заказа</option></select></label><div class="row">${btn('Отменить позицию','confirmcancel',id,'danger')}${btn('Назад','dismiss')}</div>`)}
 else if(action==='confirmcancel'){orders.find(o=>o.id===id).cancelled=true;allocations=allocations.filter(a=>a.line!==id);audit('Позиция отменена: '+$('cancelReason').value);closeDialog();render()}
 else if(action==='tableview'){map=v==='map';render()}else if(action==='opentable'){staffScreen='table';render()}
 else if(action==='staffadd'){const p=catalog.find(p=>p.id===id),g=Number($('staffGuest').value);const o={id:++uid,product:p.id,name:p.name,price:p.price,q:1,guest:g,variant:p.variants[0]?.[0]||'',served:false,cancelled:false};orders.push(o);allocations.push({id:++uid,line:o.id,unit:0,amount:o.price,state:'free',share:null,pay:null});audit('Добавлен устный заказ Гостю '+g);notice('Позиция добавлена');render()}
 else if(action==='stock'){catalog.find(p=>p.id===id).stock=!catalog.find(p=>p.id===id).stock;render()}else if(action==='editdish')editDish(v==='new'?'new':id);
 else if(action==='savedish'){const name=$('editName').value.trim(),price=Math.round(Number($('editPrice').value)*100);if(!name||!Number.isFinite(price)||price<0){notice('Укажите название и корректную цену');return}const data={name,popular:$('editPopular').checked,cat:$('editCat').value.trim()||'Без категории',desc:$('editDesc').value,weight:$('editWeight').value,price};if(v==='new')catalog.push({id:++uid,...data,stock:true,variants:[]});else Object.assign(catalog.find(p=>p.id===id),data);closeDialog();render()}
 else if(action==='deletedish'){catalog=catalog.filter(p=>p.id!==id);closeDialog();render()}else if(action==='import'){modal(`<h2>Загрузка меню</h2><label class="field"><span>Таблица с блюдами</span><input type="file" accept=".xlsx,.csv"></label>${btn('Закрыть','dismiss')}`)}
 else if(action==='transfer'){modal(`<h2>Перенести стол ${staffTable}</h2><label class="field"><span>Свободный стол</span><select id="targetTable">${[1,2,3,4,5,6,7,8,9].filter(t=>t!==staffTable).map(t=>`<option value="${t}">Стол ${t}</option>`).join('')}</select></label><div class="row">${btn('Перенести','confirmtransfer','','primary')}${btn('Отмена','dismiss')}</div>`)}else if(action==='confirmtransfer'){staffTable=Number($('targetTable').value);audit('Визит перенесен на стол '+staffTable);closeDialog();render()}
 else if(action==='close'){if(payments.some(p=>p.state==='locked')){notice('Есть платежи без результата. Сначала завершите сверку.');return}if(unpaid()&&!settings.debt){notice('Закрытие с долгом запрещено настройкой');return}modal(`<h2>Закрыть визит?</h2><p>Оплачено ${money(paid())}. Остаток ${money(unpaid())}.</p>${unpaid()?'<label class="field"><span>Причина долга</span><input id="debtReason" placeholder="Например, гости ушли"></label>':''}<div class="row">${btn(unpaid()?'Закрыть с долгом':'Закрыть визит','confirmclose','','primary')}${btn('Отмена','dismiss')}</div>`)}else if(action==='confirmclose'){if(unpaid()&&!$('debtReason').value.trim()){notice('Укажите причину долга');return}closed=true;audit('Визит закрыт');closeDialog();render()}
 else if(action==='newvisit'){orders=[];allocations=[];payments=[];shares=[];cart=[];carts={1:cart};selected=[];call=null;closed=false;guest=1;activeCartGuest=1;screen='menu';audit('Новый визит · старый остается вне демонстрации');render()}
 else if(action==='offline'){offline=!offline;render()}
});
document.addEventListener('keydown',e=>{const switcher=document.querySelector('.language-switch');if(e.key==='Escape'&&switcher?.open){switcher.open=false;switcher.querySelector('summary').focus()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='guestPick'){carts[activeCartGuest]=cart;guest=Number(t.value);cart=carts[guest]||[];activeCartGuest=guest;screen='menu';render()}else if(t.id==='splitCount'){splitCount=Math.max(2,Math.min(30,Math.floor(Number(t.value)||2)));render()}else if(t.dataset.line){const line=t.dataset.line;selectLine(Number(line));render();if(landingEmbed)document.querySelector('[data-line='+line+']')?.focus()}else if(t.dataset.setting){settings[t.dataset.setting]=t.type==='checkbox'?t.checked:t.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='splitCount'){splitCount=Math.max(2,Math.min(30,Math.floor(Number(e.target.value)||2)));const amountLabel=$('perShare');if(amountLabel)amountLabel.textContent=money(Math.floor(selSum()/splitCount));}else if(e.target.id==='search'){const caret=e.target.selectionStart;search=e.target.value;render();$('search').focus();$('search').setSelectionRange(caret,caret)}});
function landingBill(){
 const sum=selSum();
 return `${top('Общий счёт','G04')}<div class="summary"><div><div class="small">Осталось оплатить</div><strong>${money(unpaid())}</strong></div><div><div class="small">Оплачено</div><strong>${money(paid())}</strong></div></div>${orders.map(o=>{
  const aa=allocations.filter(a=>a.line===o.id),available=positionFree().filter(a=>a.line===o.id),settled=aa.filter(a=>a.state==='paid').reduce((s,a)=>s+a.amount,0);
  return `<label class="check demo-bill-item"><input type="checkbox" data-line="${o.id}" aria-label="Выбрать ${esc(o.name)}" ${available.length&&available.every(a=>selected.includes(a.id))?'checked':''} ${!available.length?'disabled':''}><span><strong>${esc(o.name)}</strong><span class="small">Гость ${o.guest} · ${money(o.price)}</span><span class="small">${settled?`Оплачено ${money(settled)}`:aa.some(a=>a.state==='locked')?'В оплате':aa.some(a=>a.share)?'В равном разделении':'Подано'}</span></span></label>`;
 }).join('')}<div class="totals"><div class="row between"><span>Ваша часть</span><strong>${money(sum)}</strong></div>${btn('Оплатить выбранное','payselected','','primary widebtn',!sum)}${payments.filter(p=>p.state==='locked').map(p=>btn('Вернуться к оплате: '+money(p.amount),'resumedemo',p.id,'widebtn')).join('')}${shares.length?btn('Посмотреть равные доли','screen','shares','widebtn'):''}</div>`;
}
function landingPayStatus(p){
 return `${top(p.state==='paid'?'Доля оплачена':'Оплата','G08')}<h2>${money(p.amount)}</h2><p>${esc(p.label)}</p>${p.state==='paid'?`<div class="note">Осталось по столу: <strong>${money(unpaid())}</strong>.</div>${shares.length?btn('К остальным долям','screen','shares','primary widebtn'):''}`:`${btn('Подтвердить оплату','paysuccess',p.id,'primary widebtn')}${btn('Оплата не прошла','payfail',p.id,'widebtn')}`}${p.tips?`<p class="small">Чаевые: ${money(p.tips)}</p>`:''}${btn('Вернуться к счёту','screen','bill','widebtn')}`;
}

function setLandingScenario(scenario){
 role='guest';init();guestLanguage='ru';
 orders=[[1,1],[2,2],[3,3]].map(([product,owner])=>{
  const p=catalog.find(item=>item.id===product);
  return {id:++uid,product,name:p.name,price:p.price,q:1,guest:owner,served:true,cancelled:false,approved:true,variant:''};
 });
 allocations=orders.map(o=>({id:++uid,line:o.id,unit:0,amount:o.price,state:'free',share:null,pay:null}));
 selected=allocations.filter(a=>scenario==='equal'||orders.find(o=>o.id===a.line).guest===guest).map(a=>a.id);
 splitCount=3;screen=scenario==='equal'?'split':'bill';render();
 window.parent.postMessage({type:'razdelit-demo-ready'},location.origin);
}
if(landingEmbed){
 window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==window.parent)return;
  if(event.data?.type==='razdelit-demo-scenario'&&['items','equal'].includes(event.data.scenario))setLandingScenario(event.data.scenario);
  if(event.data?.type==='razdelit-demo-theme'&&['light','dark'].includes(event.data.theme))document.documentElement.dataset.demoTheme=event.data.theme;
 });
 setLandingScenario('items');
}else init();
})();
</script>
</body>
