name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: node build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  https:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      pages: write
    steps:
      - name: Enable HTTPS after domain certificate is ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 90); do
            if gh api --method PUT "repos/$REPOSITORY/pages" -F https_enforced=true; then
              echo "HTTPS enabled"
              exit 0
            fi
            echo "Waiting for DNS and certificate ($attempt/90)"
            sleep 60
          done
          echo "DNS or certificate is still pending. Re-run this workflow after DNS propagation."
          exit 1
